name: Release

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本號，例如 0.18.2-ncut.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false


jobs:

  # 每個版本都要有自己的更新說明，缺了就在編譯前擋下，不發一個只有檔案表格的 release
  notes:
    name: Check Release Notes
    runs-on: ubuntu-latest
    env:
      Version: ${{ inputs.version || github.ref_name }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        sparse-checkout: .github/release-notes

    - name: Check Notes File
      run: |
        notes=".github/release-notes/$Version.md"
        if [ ! -s "$notes" ]; then
          echo "::error file=$notes::找不到 $notes，請先寫好這一版的更新說明再推標籤"
          exit 1
        fi


  build:
    name: Build (${{ matrix.arch }})
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: windows-2025-vs2026
    env:
      Version: ${{ inputs.version || github.ref_name }}
      Arch: ${{ matrix.arch }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Compile App
      run: dotnet run publish.cs -- compile --version $env:Version --arch $env:Arch

    - name: Pack (Setup and Portable)
      run: dotnet run publish.cs -- pack --version $env:Version --arch $env:Arch

    - name: Upload Artifact (Package, ${{ env.Arch }})
      uses: actions/upload-artifact@v7
      with:
        name: package_${{ env.Version }}_${{ env.Arch }}
        path: |
          publish/release/package/Starward_Setup_${{ env.Version }}_${{ env.Arch }}.exe
          publish/release/package/Starward_Portable_${{ env.Version }}_${{ env.Arch }}.7z
        if-no-files-found: error
        retention-days: 7


  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    env:
      Version: ${{ inputs.version || github.ref_name }}

    steps:
    - name: Download Artifact (Package, x64)
      uses: actions/download-artifact@v8
      with:
        name: package_${{ env.Version }}_x64
        path: package

    - name: Download Artifact (Package, arm64)
      uses: actions/download-artifact@v8
      with:
        name: package_${{ env.Version }}_arm64
        path: package

    - name: Create Checksums
      run: |
        cd package
        sha256sum * > SHA256SUMS.txt
        cat SHA256SUMS.txt

    - name: Checkout Release Notes
      uses: actions/checkout@v6
      with:
        sparse-checkout: .github/release-notes
        path: source

    # 本版更新在上，固定的檔案說明在下；generate_release_notes 會再接上 Full Changelog
    - name: Compose Release Body
      run: |
        {
          cat "source/.github/release-notes/$Version.md"
          cat <<EOF

        ---

        這是 [Scighost/Starward](https://github.com/Scighost/Starward) 的分支建置，額外支援鳴潮、終末地與異環。

        | 檔案 | 說明 |
        | --- | --- |
        | \`Starward_Setup_${Version}_x64.exe\` | 安裝版，Intel／AMD 處理器 |
        | \`Starward_Setup_${Version}_arm64.exe\` | 安裝版，ARM64 處理器 |
        | \`Starward_Portable_${Version}_x64.7z\` | 免安裝版，Intel／AMD 處理器 |
        | \`Starward_Portable_${Version}_arm64.7z\` | 免安裝版，ARM64 處理器 |

        本建置的自動更新只看這個倉庫的 Release，不會被上游版本覆蓋。自動更新需要 \`SHA256SUMS.txt\` 與上面的檔名，請勿改名。
        EOF
        } > body.md
        cat body.md

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ env.Version }}
        name: ${{ env.Version }}
        draft: false
        prerelease: ${{ contains(env.Version, '-') }}
        generate_release_notes: true
        files: package/*
        body_path: body.md
