<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <!-- 只跑本页自己的脚本；公告正文来自库洛的 CDN，插入前先清掉脚本与事件属性，这里再挡一层 -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src https: data:; media-src https:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <link rel="stylesheet" href="notice.css">
</head>
<body>
    <div class="board" id="board">
        <div class="header">
            <svg class="header-deco" viewBox="0 0 440 113" preserveAspectRatio="none" aria-hidden="true"></svg>
            <div class="tabs" id="tabs"></div>
            <button class="icon-button back" id="back" aria-label="back"></button>
            <button class="icon-button close" id="close" aria-label="close"></button>
        </div>

        <!-- 卡片墙 -->
        <svg class="grid-deco" viewBox="0 0 14 670" aria-hidden="true"></svg>
        <div class="scroll grid-scroll" id="grid-scroll">
            <div class="grid" id="grid"></div>
        </div>
        <div class="scrollbar grid-bar" id="grid-bar"><div class="thumb"></div></div>

        <!-- 详细模式 -->
        <div class="scroll list-scroll" id="list-scroll">
            <div class="list" id="list"></div>
        </div>
        <div class="scroll content-scroll" id="content-scroll">
            <div class="content" id="content"></div>
        </div>
        <div class="scrollbar content-bar" id="content-bar"><div class="thumb"></div></div>

        <!-- 日历：长图卷动，热区跟着图走；指针固定不动 -->
        <div class="calendar-view" id="calendar-view">
            <div class="calendar-scroll" id="calendar-scroll">
                <div class="calendar-sheet">
                    <img id="calendar-image" alt="" draggable="false">
                    <div class="calendar-nodes" id="calendar-nodes"></div>
                </div>
            </div>
            <div class="calendar-pointer" id="calendar-pointer">
                <div class="calendar-tags"><span class="date" id="calendar-date"></span><span class="now">NOW</span></div>
                <svg class="calendar-spark" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 0 Q11 9 20 10 Q11 11 10 20 Q9 11 0 10 Q9 9 10 0 Z"/></svg>
            </div>
            <div class="scrollbar calendar-bar" id="calendar-bar"><div class="thumb"></div></div>
        </div>

        <div class="message" id="message"></div>

        <!-- 日历热区点到还没上架的公告时的提示框 -->
        <div class="popup" id="popup">
            <div class="popup-box">
                <div class="popup-title" id="popup-title"></div>
                <button class="icon-button popup-close" id="popup-close" aria-label="close"></button>
                <div class="popup-text" id="popup-text"></div>
            </div>
        </div>
    </div>
    <script src="notice.js"></script>
</body>
</html>
